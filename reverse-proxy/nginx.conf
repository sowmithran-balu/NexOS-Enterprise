# ==============================================================================
# NexOS Enterprise ERP - Layer 2: Ingress API Gateway & Reverse Proxy (Nginx)
# Hardened Configuration: TLS 1.3, Rate-Limiting, Payload Sizing, IP Whitelisting
# ==============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging with Real Client IP tracing
    log_format  nexos_secure  '$remote_addr - $remote_user [$time_local] "$request" '
                              '$status $body_bytes_sent "$http_referer" '
                              '"$http_user_agent" "$http_x_forwarded_for" '
                              'rt=$request_time uct="$upstream_connect_time"';

    access_log  /var/log/nginx/access.log  nexos_secure;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off; # Prevent version banner leaking

    # --------------------------------------------------------------------------
    # Rate Limiting Zones (Token Bucket Ingress Shield)
    # --------------------------------------------------------------------------
    # Strict 5 requests/min per IP for sensitive auth routes (brute-force defense)
    limit_req_zone $binary_remote_addr zone=nexos_auth_zone:10m rate=5r/m;

    # 50 requests/sec per IP for general REST APIs (DoS defense)
    limit_req_zone $binary_remote_addr zone=nexos_api_zone:10m rate=50r/s;

    limit_req_status 429;

    # --------------------------------------------------------------------------
    # Upstream Definitions (Microsegmentation: East-West isolated app_net)
    # --------------------------------------------------------------------------
    upstream backend_cluster {
        server backend:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream frontend_cluster {
        server frontend:5174;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # HTTP -> HTTPS Redirection (Port 80 to 443)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        server_name nexos.enterprise.local localhost;

        # Redirect all unencrypted HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
    }

    # --------------------------------------------------------------------------
    # Primary HTTPS Server (Port 443)
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name nexos.enterprise.local localhost;

        # TLS Hardening
        ssl_certificate     /etc/nginx/certs/nexos_server.crt;
        ssl_certificate_key /etc/nginx/certs/nexos_server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Edge Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Default Payload Limit (Prevents Heap Exhaustion / Buffer Overflow DoS)
        client_max_body_size 1M;
        client_body_buffer_size 128k;

        # ----------------------------------------------------------------------
        # Layer 2 Auth Route Shield: Rate-limited, No Delay
        # ----------------------------------------------------------------------
        location /api/auth/login {
            limit_req zone=nexos_auth_zone burst=3 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # Document Uploads: Controlled 10MB payload size limit
        # ----------------------------------------------------------------------
        location /api/documents/upload {
            client_max_body_size 10M;

            limit_req zone=nexos_api_zone burst=20 nodelay;
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # Admin / Sensitive Ledger Endpoints: Corporate IP Whitelist Gate
        # ----------------------------------------------------------------------
        location /api/security/ {
            # Corporate VPN & Office CIDR Whitelist
            # allow 10.0.0.0/8;
            # allow 192.168.1.0/24;
            # allow 127.0.0.1;
            # deny all;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # General REST API Proxying
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=nexos_api_zone burst=50 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # Block Internal H2 / Debug consoles from Edge Ingress completely
        # ----------------------------------------------------------------------
        location /h2-console {
            deny all;
            return 404;
        }

        # ----------------------------------------------------------------------
        # Frontend UI Ingress
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
