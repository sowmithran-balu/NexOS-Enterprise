# ==============================================================================
# NexOS Enterprise ERP - Layer 1 & 4: Juniper SRX / cSRX Cloud Firewall Configuration
# Hierarchical Defense-in-Depth for Juniper Cloud Networks & Security Director Cloud
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Security Zones & Interfaces
# ------------------------------------------------------------------------------
set security zones security-zone untrust interfaces ge-0/0/0.0 host-inbound-traffic system-services ping
set security zones security-zone untrust interfaces ge-0/0/0.0 host-inbound-traffic system-services https
set security zones security-zone dmz interfaces ge-0/0/1.0 host-inbound-traffic system-services ping
set security zones security-zone app-zone interfaces ge-0/0/2.0 host-inbound-traffic system-services ping
set security zones security-zone db-zone interfaces ge-0/0/3.0 host-inbound-traffic system-services ping

# ------------------------------------------------------------------------------
# 2. Dynamic Address Books & Juniper SecIntel Integration
# ------------------------------------------------------------------------------
set security address-book global address NGINX_INGRESS_PROXY 10.0.1.10/32
set security address-book global address SPRING_BOOT_BACKEND 10.0.2.20/32
set security address-book global address SQL_SERVER_DB 10.0.3.30/32
set security address-book global address-set BANNED_IPS
set security dynamic-address-book feed NexOS_SecIntel_ERP_Threats url "https://juniper-srx.cloud.nexos.internal:8443/secintel/feed"
set security dynamic-address-book feed NexOS_SecIntel_ERP_Threats update-interval 60

# ------------------------------------------------------------------------------
# 3. Geo-Fencing & GeoIP Policy (Layer 1: Edge Perimeter)
# ------------------------------------------------------------------------------
set security dynamic-address-book geo-ip database auto-update interval 24
set security address-book global address-set ALLOWED_OPERATING_COUNTRIES geo-ip-country US
set security address-book global address-set ALLOWED_OPERATING_COUNTRIES geo-ip-country CA
set security address-book global address-set ALLOWED_OPERATING_COUNTRIES geo-ip-country GB
set security address-book global address-set ALLOWED_OPERATING_COUNTRIES geo-ip-country DE
set security address-book global address-set ALLOWED_OPERATING_COUNTRIES geo-ip-country IN
set security address-book global address-set ALLOWED_OPERATING_COUNTRIES geo-ip-country SG

# ------------------------------------------------------------------------------
# 4. Applications & Port Definitions
# ------------------------------------------------------------------------------
set applications application APP_NEXOS_HTTPS protocol tcp destination-port 443
set applications application APP_NEXOS_SPRING_API protocol tcp destination-port 8080
set applications application APP_MSSQL_PORT protocol tcp destination-port 1433

# ------------------------------------------------------------------------------
# 5. Security Policies (North-South & East-West Microsegmentation)
# ------------------------------------------------------------------------------

# POLICY 1: Drop Banned IPs from Dynamic SecIntel Feed immediately at Wire Speed
set security policies from-zone untrust to-zone dmz policy DROP_BANNED_THREATS match source-address BANNED_IPS
set security policies from-zone untrust to-zone dmz policy DROP_BANNED_THREATS match destination-address any
set security policies from-zone untrust to-zone dmz policy DROP_BANNED_THREATS match application any
set security policies from-zone untrust to-zone dmz policy DROP_BANNED_THREATS then reject

# POLICY 2: Ingress HTTPS to DMZ with Geo-Fencing & IDP OWASP Inspection
set security policies from-zone untrust to-zone dmz policy INGRESS_HTTPS_PERIMETER match source-address ALLOWED_OPERATING_COUNTRIES
set security policies from-zone untrust to-zone dmz policy INGRESS_HTTPS_PERIMETER match destination-address NGINX_INGRESS_PROXY
set security policies from-zone untrust to-zone dmz policy INGRESS_HTTPS_PERIMETER match application APP_NEXOS_HTTPS
set security policies from-zone untrust to-zone dmz policy INGRESS_HTTPS_PERIMETER then permit application-services idp-policy OWASP_CORE_RULESET
set security policies from-zone untrust to-zone dmz policy INGRESS_HTTPS_PERIMETER then permit application-services utm-policy NEXOS_WEB_PROTECT
set security policies from-zone untrust to-zone dmz policy INGRESS_HTTPS_PERIMETER then log session-init
set security policies from-zone untrust to-zone dmz policy INGRESS_HTTPS_PERIMETER then log session-close

# POLICY 3: Default Deny All from Untrust (Geo-Fencing Enforcement)
set security policies from-zone untrust to-zone dmz policy DEFAULT_DENY_UNTRUST match source-address any
set security policies from-zone untrust to-zone dmz policy DEFAULT_DENY_UNTRUST match destination-address any
set security policies from-zone untrust to-zone dmz policy DEFAULT_DENY_UNTRUST match application any
set security policies from-zone untrust to-zone dmz policy DEFAULT_DENY_UNTRUST then reject
set security policies from-zone untrust to-zone dmz policy DEFAULT_DENY_UNTRUST then count

# POLICY 4: Layer 4 Microsegmentation (DMZ to App-Zone only on port 8080)
set security policies from-zone dmz to-zone app-zone policy DMZ_TO_BACKEND_API match source-address NGINX_INGRESS_PROXY
set security policies from-zone dmz to-zone app-zone policy DMZ_TO_BACKEND_API match destination-address SPRING_BOOT_BACKEND
set security policies from-zone dmz to-zone app-zone policy DMZ_TO_BACKEND_API match application APP_NEXOS_SPRING_API
set security policies from-zone dmz to-zone app-zone policy DMZ_TO_BACKEND_API then permit

# POLICY 5: Layer 4 & 5 Database Guard (App-Zone to DB-Zone only on 1433)
set security policies from-zone app-zone to-zone db-zone policy BACKEND_TO_SQLSERVER match source-address SPRING_BOOT_BACKEND
set security policies from-zone app-zone to-zone db-zone policy BACKEND_TO_SQLSERVER match destination-address SQL_SERVER_DB
set security policies from-zone app-zone to-zone db-zone policy BACKEND_TO_SQLSERVER match application APP_MSSQL_PORT
set security policies from-zone app-zone to-zone db-zone policy BACKEND_TO_SQLSERVER then permit

# POLICY 6: Zero-Trust Strict Isolation: Block DMZ / Frontend from touching DB-Zone directly
set security policies from-zone dmz to-zone db-zone policy ISOLATE_FRONTEND_FROM_DB match source-address any
set security policies from-zone dmz to-zone db-zone policy ISOLATE_FRONTEND_FROM_DB match destination-address any
set security policies from-zone dmz to-zone db-zone policy ISOLATE_FRONTEND_FROM_DB match application any
set security policies from-zone dmz to-zone db-zone policy ISOLATE_FRONTEND_FROM_DB then reject

# ------------------------------------------------------------------------------
# 6. Juniper Mist AI Cloud & Security Director Telemetry Stream
# ------------------------------------------------------------------------------
set system syslog host mist-cloud.juniper.net any any
set system syslog host mist-cloud.juniper.net match "RT_FLOW|RT_IDP|NEXOS_WAF"
set services analytics streaming-server mist-collector remote-ip 198.51.100.100 port 2055
